<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Referer gönderme: n11 gibi hotlink-korumalı CDN'ler github.io referer'li
       görsel isteklerini blokluyor; no-referrer ile görseller yüklenir. -->
  <meta name="referrer" content="no-referrer" />
  <title>TR E-Ticaret Meta Arama — Demo</title>
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
  <header>
    <a id="logo" href="#" aria-label="Anasayfa">
      <h1>metaara<span class="dot">.</span></h1>
    </a>
    <p class="sub">Trendyol, Hepsiburada ve n11 — tek aramada fiyat karşılaştırma</p>
  </header>

  <main>
    <section class="search">
      <form id="ara-form" autocomplete="off">
        <input id="q" type="text" placeholder="Ürün ara: beyaz erkek spor ayakkabı, haki mont…"
               aria-label="Ürün arama" />
        <button id="ara" type="submit">Ara</button>
      </form>
      <div id="durum" class="durum" hidden></div>
    </section>

    <!-- 1) Landing / anasayfa -->
    <section id="welcome" class="welcome">
      <p class="welcome-tag">Popüler aramalar</p>
      <div class="ornekler" id="ornekler">
        <button type="button" class="ornek">beyaz erkek spor ayakkabı</button>
        <button type="button" class="ornek">haki mont</button>
        <button type="button" class="ornek">kırmızı kadın topuklu ayakkabı</button>
        <button type="button" class="ornek">lacivert erkek kaban</button>
        <button type="button" class="ornek">siyah deri cüzdan</button>
      </div>
    </section>

    <!-- 2) Arama sırasında -->
    <section id="loading" class="loading" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p class="loading-txt">“<span id="loading-q"></span>” aranıyor…</p>
      <p class="ipucu">3 site canlı taranıyor · ~30-60 sn sürebilir</p>
    </section>

    <!-- 3) Sonuçlar -->
    <section id="sonuc" class="sonuc" hidden>
      <button type="button" id="geri" class="geri">← Anasayfa</button>
      <div class="query">
        <div id="sorgu">—</div>
        <div id="meta" class="meta"></div>
      </div>
      <div id="liste" class="grid" aria-live="polite"></div>
      <p id="bos" class="bos" hidden>Sonuç bulunamadı — başka bir sorgu deneyin.</p>
    </section>
  </main>

  <footer>
    <span>Kişisel proje · ticari bir servis değildir</span>
    <span id="guncelleme" class="guncelleme"></span>
  </footer>

  <script src="app.js?v=2"></script>
</body>
</html>
